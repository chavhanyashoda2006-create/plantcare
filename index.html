function classify(img){const c=document.createElement("canvas");c.width=c.height=100;const x=c.getContext("2d");x.drawImage(img,0,0,100,100);
 const p=x.getImageData(0,0,100,100).data;let n=0,br=0,ye=0,wh=0,or=0;
 for(let i=0;i<p.length;i+=4){const r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);if(mx<.15)continue;n++;
  const s=mx?d/mx:0;let h=0;if(d){h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360;}
  if(s<.12&&mx>.8)wh++;else if(h>=10&&h<40&&s>.6&&mx>.7)or++;else if(h>=10&&h<40&&s>.3&&mx<=.7)br++;else if(h>=40&&h<70&&s>.4&&mx>.5)ye++;}

 const sc=[["wh",f(wh)/.12],["or",f(or)/.08],["br",f(br)/.05],["ye",f(ye)/.15]].sort((a,b)=>b[1]-a[1])[0];
 return sc[1]<1?{k:"ok",conf:.8+Math.random()*.1}:{k:(MAP[crop]||MAP.tomato)[sc[0]],conf:Math.min(.95,.6+sc[1]*.12)};}

 $("clr").textContent=u.clr;$("nt").textContent=u.nt;$("lang").value=L;const k2=UK[L];$("sht").textContent=k2.pk;$("bc").textContent=k2.cam;$("bg").textContent=k2.gal;$("bx").textContent=k2.cx;$("kc").innerHTML=`<h3>${k2.t}</h3><p class="sub">${k2.h}</p>`+(KEY()?`<button class="btn g" id="krm">${k2.rm}</button>`:`<input id="kin" placeholder="AIza..." class="inp"><button class="btn" id="ksv">${k2.sv}</button>`);if($("ksv"))$("ksv").onclick=()=>{const v=$("kin").value.trim();if(v){localStorage.gkey=v;render();}};if($("krm"))$("krm").onclick=()=>{localStorage.removeItem("gkey");render();};
 $("dt").textContent="FIELD INTELLIGENCE · "+new Date().toLocaleDateString(L=="mr"?"mr-IN":"en-IN",{day:"numeric",month:"long",year:"numeric"});
 $("chips").innerHTML=Object.keys(CR).map(k=>`<button class="chip ${k==crop?"on":""}" data-c="${k}">${CR[k][i]}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{crop=b.dataset.c;localStorage.crop=crop;render();});
 if(last){const d=last,k=d.x,ok=d.score>=70,C=339.3,col=ok?"#3a9a45":"#c8631a";
  $("out").innerHTML=`<section class="card"><div class="lbl">${u.ws}</div><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="54" fill="none" style="stroke:var(--rt)" stroke-width="12"/>
  <circle cx="75" cy="75" r="54" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-d.score/100)}"/></svg>
  <div class="${ok?"ok":"wa"}">${d.score}<small>/100</small></div></div><h3 style="text-align:center" class="${ok?"ok":"wa"}">${ok?u.gd:u.wt}</h3></section>
  <section class="card"><img class="big" src="${d.img}">${d.rough?`<p class="wa">⚠ ${u.rough}</p>`:""}<div class="row" style="margin-top:12px"><div><div class="lbl">${u.la}</div><h3>${k.n[i]} · ${d.cl[i]}</h3></div>
  <div class="conf">${Math.round(d.conf*100)}%<br><small>${u.cf}</small></div></div><p class="sub">${k.d[i]}</p>
  <span class="pill">${d.cl[i]}</span><span class="pill">${k.g[i]}</span></section>
  <section class="card"><h3>${u.st}</h3>${[["💊",u.t,k.t],["🛡️",u.p,k.p],["🌱",u.c,k.c]].map((x,j)=>`<div class="st"><i>0${j+1}</i><div><b>${x[0]} ${x[1]}</b><p>${x[2][i]}</p></div></div>`).join("")}
  <button class="btn" id="say">${u.ls}</button><button class="btn g" id="stop">${u.sp}</button>
  <p><small id="nv">${u.nv}</small></p></section>`;
  $("say").onclick=()=>speak(d);$("stop").onclick=stopAll;}
 $("hist").innerHTML=hist().map(x=>`<div class="h"><img src="${x.th}"><div>${(x.n||D[x.k].n)[i]} · ${(x.cl||CR[x.crop])[i]}<br><small>${Math.round(x.conf*100)}% · ${x.date}</small></div></div>`).join("");}

const sh=v=>$("sheet").style.display=v?"flex":"none";
$("drop").onclick=()=>sh(1);$("bx").onclick=()=>sh(0);$("sheet").onclick=e=>{if(e.target.id=="sheet")sh(0)};
$("bc").onclick=()=>{sh(0);$("cam").click();};$("bg").onclick=()=>{sh(0);$("file").click();};
$("lang").onchange=e=>{L=e.target.value;localStorage.lang2=L;stopAll();render();};
$("clr").onclick=()=>{localStorage.hist="[]";render();};
const scanH=e=>{const f=e.target.files[0];if(!f)return;$("fn").textContent=f.name;const img=new Image();
 img.onload=async()=>{let x,cl,conf,score,msg="",rough=false;
  if(KEY()){$("fn").textContent=UK[L].an;try{const o=await ai(img);if(o.is_leaf===false){$("fn").textContent=UK[L].nl;return;}
   x={n:[o.disease_mr,o.disease_en],d:[o.desc_mr,o.desc_en],g:o.healthy?["निरोगी","Healthy"]:[o.type_mr||"AI",o.type_en||"AI"],t:[o.treat_mr,o.treat_en],p:[o.prev_mr,o.prev_en],c:[o.care_mr,o.care_en]};
   cl=[o.crop_mr||"—",o.crop_en||"—"];conf=Math.min(1,(+o.confidence||80)/100);score=Math.max(0,Math.min(100,Math.round(+o.health_score||60)));}
  catch(err){msg=UK[L].er+err.message;}}
  if(!x){const r=classify(img);x=r.k=="ok"?D.ok:D[r.k];cl=crop=="auto"?["—","—"]:CR[crop];rough=true;conf=r.conf;score=r.k=="ok"?Math.min(100,90+Math.round(r.conf*10)):Math.max(10,100-Math.round(r.conf*45));}
  const b=document.createElement("canvas"),sc=Math.min(1,600/img.width);b.width=img.width*sc;b.height=img.height*sc;b.getContext("2d").drawImage(img,0,0,b.width,b.height);
  last={x,cl,conf,score,rough,img:b.toDataURL("image/jpeg",.7)};
  const h=hist();h.unshift({n:x.n,cl,conf,th:thumb(img),date:new Date().toLocaleDateString()});try{localStorage.hist=JSON.stringify(h.slice(0,10))}catch(z){}
  render();$("fn").textContent=msg?msg.slice(0,140):f.name;speak(last);$("out").scrollIntoView({behavior:"smooth"});};
 img.src=URL.createObjectURL(f);e.target.value="";};
$("file").onchange=scanH;$("cam").onchange=scanH;
let TH=localStorage.theme||"light";function applyTh(){document.documentElement.dataset.theme=TH;$("th").textContent=TH=="light"?"🌙":"☀️";document.querySelector("meta[name=theme-color]").content=TH=="light"?"#f6f4ec":"#141210";}
$("th").onclick=()=>{TH=TH=="light"?"dark":"light";localStorage.theme=TH;applyTh();};applyTh();
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};render();
</script></body></html>
